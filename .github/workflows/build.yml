# Every push and pull request: build Lanes.exe and the release package, then run the self-checks.
# A version tag (vX.Y.Z, matching version.json) also publishes the GitHub release with release-notes/X.Y.Z.md.
name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build.cjs --release
      - run: node check.cjs
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$v" = "$(node -p "require('./version.json').version")" || { echo "tag $GITHUB_REF_NAME does not match version.json"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "dist/Lanes-$v.zip" --title "Lanes $v" --notes-file "release-notes/$v.md"
